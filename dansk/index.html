<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ordspil – Level 2</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23232C2D' stroke='white'/%3E%3Cpath d='M9 11h9M9 16h14M9 21h7' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{--bg:#232C2D;--ink:#ffffff;--muted:#9aa3a4;--line:#ffffff;--red:#e0a3a3;--ok:#9fd3a8;--bad:#ff8a80}
*{box-sizing:border-box;margin:0}
body{font-family:"Trebuchet MS",verdana,arial,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 16px 56px;text-transform:lowercase}
.wrap{width:100%;max-width:820px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;letter-spacing:.02em}
.brand svg{width:34px;height:34px;color:#fff}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);padding:5px 10px;font-size:13px;color:var(--muted);box-shadow:4px 4px 10px #000;background:var(--bg)}
.chip b{color:#fff;font-weight:normal}
.bar{height:6px;border:1px solid var(--line);margin-bottom:22px;box-shadow:4px 4px 10px #000}
.bar i{display:block;height:100%;width:0;background:#fff;transition:width .35s ease}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px;font-size:13px;color:var(--muted)}
select,button{font:inherit;text-transform:lowercase;color:#fff;background:var(--bg);border:1px solid var(--line);border-radius:0;padding:6px 12px;cursor:pointer;box-shadow:4px 4px 10px #000}
select:hover,button:hover{background:#fff;color:#777}
input[type=checkbox]{accent-color:#fff}
.board{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.col{display:flex;flex-direction:column;gap:14px}
.col h2{font-size:13px;letter-spacing:.15em;color:var(--muted);font-weight:normal;padding-left:2px}
.card{position:relative;min-height:62px;padding:14px 16px;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:0;font-size:17px;line-height:1.25;color:#fff;box-shadow:7px 7px 15px #000;transition:background .15s,color .15s,opacity .4s,transform .12s}
.card.da{color:var(--red)}
.card:hover:not(:disabled){background:#fff;color:#777}
.card.sel{background:#fff;color:#232C2D}
.card.ok{border-color:var(--ok);color:var(--ok);background:var(--bg);opacity:.45;cursor:default;box-shadow:none}
.card.bad{border-color:var(--bad);color:var(--bad);animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.done{display:none;text-align:center;background:#fff;color:#000;border:1px solid #000;padding:36px 24px 30px;margin-top:8px;box-shadow:7px 7px 15px #000;position:relative}
.done.show{display:block;animation:pop .35s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}}
.done h3{font-size:15px;font-weight:normal;position:absolute;top:-13px;left:20px;background:#fff;border:1px solid #000;padding:2px 8px}
.done p{color:#555;margin-bottom:18px;font-size:14px}
.done button{background:#232C2D;color:#fff;border:1px solid #232C2D;padding:10px 24px;font-size:15px}
.done button:hover{background:#fff;color:#777;border-color:#000}
.review{margin:0 auto 22px;max-width:520px;text-align:left;font-size:14px;border-top:1px solid #000}
.review div{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;border-bottom:1px solid #dcdcdc}
.review span:first-child{color:#934d4d}
.card.en,.review span{text-transform:none}
footer{margin-top:34px;font-size:12px;color:var(--muted);text-align:center}
kbd{font-family:inherit;border:1px solid var(--muted);padding:0 5px}
@media (max-width:560px){.card{font-size:14px;padding:10px 12px;min-height:52px}.board{gap:12px}}
</style>
</head>

<div class="wrap">
<header>
  <div class="brand"><svg viewBox="0 0 32 32" fill="none" aria-label="Ordspil logo"><rect x="1.5" y="1.5" width="29" height="29" stroke="currentColor" stroke-width="3"/><path d="M9 11h9M9 16h14M9 21h7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>ordspil <span style="color:var(--muted)">· level 2</span></div>
  <div class="stats">
    <span class="chip">Niveau <b id="lvl">1</b></span>
    <span class="chip">Lært <b id="learned">0</b></span>

    <span class="chip">Stime <b id="streak">0</b></span>
  </div>
</header>
<div class="bar"><i id="prog"></i></div>
<div class="controls">
  <label>Ordforråd <select id="filter"></select></label>
  <button id="skip" title="Spring over">Nye ord</button>

  <label><input type="checkbox" id="speak" checked> Udtal danske ord</label>
</div>
<div class="board" id="board">
  <div class="col" id="colDa"><h2>Dansk</h2></div>
  <div class="col" id="colEn"><h2>English</h2></div>
</div>
<div class="done" id="done">
  <h3>Godt klaret!</h3>
  <p id="doneMsg"></p>
  <div class="review" id="review"></div>
  <button id="next">Næste niveau →</button>
</div>
<footer>Klik på et dansk ord og derefter på den rigtige oversættelse. Tryk <kbd>Enter</kbd> for næste niveau.</footer>
</div>

const $=id=>document.getElementById(id);
const S=JSON.parse(localStorage.getItem('ordspil_v2')||'{}');
S.level??=1;S.learned??=0;S.filter??='all';S.seen??={};
const save=()=>localStorage.setItem('ordspil_v2',JSON.stringify(S));
const groups=[['all','Alle ord ('+WORDS.length+')']];
for(let k=1;k<=6;k++)groups.push(['k'+k,'Kapitel '+k+' ('+WORDS.filter(w=>w[2]==k).length+')']);
groups.push(['r','Uden kapitel ('+WORDS.filter(w=>!w[2]).length+')']);
$('filter').innerHTML=groups.map(([v,t])=>`<option value="${v}">${t}</option>`).join('');
$('filter').value=S.filter;
const pool=()=>WORDS.map((w,i)=>i).filter(i=>S.filter==='all'||(S.filter==='r'?!WORDS[i][2]:'k'+WORDS[i][2]===S.filter));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let round=[],selDa=null,selEn=null,matched=0,miss=0,streak=0,roundMiss=0;
function pick(){
  const p=pool(),key=S.filter;S.seen[key]??=[];
  let fresh=shuffle(p.filter(i=>!S.seen[key].includes(i)));
  if(fresh.length<6){S.seen[key]=[];fresh=shuffle(p.slice());}
  const out=[],da=new Set(),en=new Set();
  for(const i of fresh){const[d,e]=WORDS[i],a=d.toLowerCase(),b=e.toLowerCase();if(da.has(a)||en.has(b))continue;da.add(a);en.add(b);out.push(i);if(out.length===6)break}
  S.seen[key].push(...out);save();return out;
}
function card(txt,cls,idx){const b=document.createElement('button');b.className='card '+cls;b.textContent=txt;b.dataset.i=idx;b.onclick=()=>choose(b);return b}
function start(){
  round=pick();matched=0;roundMiss=0;selDa=selEn=null;
  $('done').classList.remove('show');$('board').style.display='';
  ['colDa','colEn'].forEach(c=>$(c).querySelectorAll('.card').forEach(n=>n.remove()));
  shuffle(round.slice()).forEach(i=>$('colDa').append(card(WORDS[i][0],'da',i)));
  shuffle(round.slice()).forEach(i=>$('colEn').append(card(WORDS[i][1],'en',i)));
  ui();
}
function say(t){if(!$('speak').checked||!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='da-DK';u.rate=.9;speechSynthesis.speak(u)}
function choose(b){
  if(b.classList.contains('ok'))return;
  const isDa=b.classList.contains('da');
  if(isDa){selDa?.classList.remove('sel');selDa=b;say(b.textContent)}else{selEn?.classList.remove('sel');selEn=b}
  b.classList.add('sel');
  if(selDa&&selEn){
    const a=selDa,c=selEn;selDa=selEn=null;
    const ok=a.dataset.i===c.dataset.i||(WORDS[a.dataset.i][1].toLowerCase()===c.textContent.toLowerCase());
    if(ok){[a,c].forEach(n=>{n.classList.remove('sel');n.classList.add('ok');n.disabled=true});matched++;streak++;if(matched===6)finish()}
    else{miss++;roundMiss++;streak=0;[a,c].forEach(n=>{n.classList.remove('sel');n.classList.add('bad');setTimeout(()=>n.classList.remove('bad'),400)})}
    ui();
  }
}
function finish(){
  S.learned+=6;save();
  setTimeout(()=>{
    $('board').style.display='none';
    $('doneMsg').textContent=`Niveau ${S.level} gennemført med ${roundMiss} fejl.`;
    $('review').innerHTML=round.map(i=>`<div><span>${esc(WORDS[i][0])}</span><span>${esc(WORDS[i][1])}</span></div>`).join('');
    $('done').classList.add('show');S.level++;save();ui();$('next').focus();
  },450);
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function ui(){$('lvl').textContent=S.level;$('learned').textContent=S.learned;$('miss').textContent=miss;$('streak').textContent=streak;$('prog').style.width=(matched/6*100)+'%'}
$('next').onclick=start;
$('skip').onclick=start;
$('filter').onchange=e=>{S.filter=e.target.value;save();start()};
$('reset').onclick=()=>{if(confirm('Nulstil niveau og fremskridt?')){localStorage.removeItem('ordspil_v2');location.reload()}};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&$('done').classList.contains('show')){e.preventDefault();start()}});
start();
</script>
